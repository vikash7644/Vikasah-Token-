services:
  - type: web
    name: vkt-merchant-studio
    runtime: node
    plan: free
    rootDir: merchant-studio/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: VKT_API_BASE_URL
        sync: false
      - key: MERCHANT_API_KEY
        sync: false
