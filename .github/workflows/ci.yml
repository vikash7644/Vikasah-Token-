name: VKT Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check Merchant Studio JavaScript syntax
        run: node --check merchant-studio/app.js
      - name: Compile contracts
        run: npm run compile
      - name: Run tests
        run: npm test
