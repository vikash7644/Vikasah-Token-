name: VKT Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile contracts
        run: npm run compile
      - name: Run tests
        run: npm test

      - name: Check Developer Portal JavaScript syntax
        run: |
          node --check developer-portal/app.js
          node --check developer-portal/sdk/src/index.js
          node --check developer-portal/api/server.mjs
      - name: Install Developer Portal SDK dependencies
        working-directory: developer-portal/sdk
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Developer Portal API dependencies
        working-directory: developer-portal/api
        run: npm install --no-audit --no-fund
